name: Ceny zl/gr dla Meta

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zbuduj plik cen
        run: python3 build.py
      - name: Zapisz zmiany
        run: |
          git config user.name "flystore-bot"
          git config user.email "github-actions@users.noreply.github.com"
          git add ceny-zl-gr.csv ostatnia_aktualizacja.txt
          git diff --cached --quiet || git commit -m "Aktualizacja cen"
          git push
